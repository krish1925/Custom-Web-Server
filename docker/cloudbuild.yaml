steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker pull gcr.io/$PROJECT_ID/vibe-code-only:base || exit 0
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-f', 'docker/base.Dockerfile',
    '-t', 'vibe-code-only:base',
    '-t', 'gcr.io/$PROJECT_ID/vibe-code-only:base',
    '--cache-from', 'gcr.io/$PROJECT_ID/vibe-code-only:base',
    '.'
  ]
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/vibe-code-only:base']
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-f', 'docker/Dockerfile',
    '-t', 'gcr.io/$PROJECT_ID/vibe-code-only:latest',
    '.'
  ]
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-f', 'docker/coverage.Dockerfile',
    '-t', 'vibe-code-only:coverage',
    '.'
  ]
# Add deployment step
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud compute ssh web-server --zone=us-west1-a --command="
    docker pull gcr.io/$PROJECT_ID/vibe-code-only:latest && 
    docker stop klt-web-server-izef || true && 
    docker rm klt-web-server-izef || true && 
    docker run -d --name klt-web-server-izef gcr.io/$PROJECT_ID/vibe-code-only:latest"
images: ['gcr.io/$PROJECT_ID/vibe-code-only:base', 'gcr.io/$PROJECT_ID/vibe-code-only:latest']
